name: Daily Price Scrape

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# A manual run overlapping the nightly one would insert every price twice.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A normal run takes ~1h40m; run.py gives up on stuck scrapers after 2.5h
    # and inserts what it has. This is the backstop above that (GitHub's
    # default is 6h, which a single wedged browser call once burned through).
    timeout-minutes: 200
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Playwright + Chromium
        # --with-deps refreshes the apt index and installs exactly the system
        # libraries this Playwright version needs on the runner's Ubuntu.
        run: playwright install --with-deps chromium

      - name: Seed products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/seed_products.py

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run.py
