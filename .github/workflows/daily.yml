name: Daily Price Scrape

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# A manual run overlapping the nightly one would insert every price twice.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A normal run takes ~1h40m; run.py gives up on stuck scrapers after 2.5h
    # and inserts what it has. This is the backstop above that (GitHub's
    # default is 6h, which a single wedged browser call once burned through).
    timeout-minutes: 200
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Playwright + Chromium
        # Not `--with-deps`: Playwright 1.44 predates Ubuntu 24.04 and asks for
        # libasound2, which noble renamed to libasound2t64. Refresh the apt
        # index first so a stale runner image can't fail the install.
        run: |
          playwright install chromium
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Seed products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/seed_products.py

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run.py
